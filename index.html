<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container" >
        <div id="quizContainer">
            <div id="quizHeader">
                <h1>Mathematical Quiz</h1>
            </div>
            <div id="quizContent">
                <div id="questionContainer">
                    <h2 id="question">Question will appear here</h2>
                </div>
                <div id="optionsContainer">
                    <button class="optionBtn" id="option1">Option 1</button>
                    <button class="optionBtn" id="option2">Option 2</button>
                    <button class="optionBtn" id="option3">Option 3</button>
                    <button class="optionBtn" id="option4">Option 4</button>
                </div>
            
            </div>
            <div id="quizFooter">
                <button id="nextBtn">Next Question</button>
                <button id="prevBtn">Previous Question</button>
            </div>
        </div>
    </div>


<script src="app.js"></script>    
</body>
</html>
